name: Fahad Job Agent

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - ".github/workflows/job-agent.yml"
      - "cvs/**"
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 13 * * *"

concurrency:
  group: fahad-job-agent-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  search-and-prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate final CVs
        run: |
          test -s cvs/graphic_designer_cv.pdf
          test -s cvs/business_computer_cv.pdf
          echo "Final CVs found:"
          ls -lh cvs/graphic_designer_cv.pdf cvs/business_computer_cv.pdf

      - name: Validate Python syntax
        run: python -m py_compile src/*.py

      - name: Sync Forbes Global 2000 targets
        run: python src/forbes_global2000.py

      - name: Search public job sources
        run: python src/job_search.py

      - name: Search signed-in Facebook and Instagram (optional TinyFish)
        env:
          TINYFISH_SOCIAL_SEARCH_ENABLED: ${{ secrets.TINYFISH_SOCIAL_SEARCH_ENABLED }}
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
          TINYFISH_PROFILE_ID: ${{ secrets.TINYFISH_PROFILE_ID }}
        run: python src/social_media_search.py

      - name: Prepare applications
        run: python src/application_generator.py

      - name: Build compliant application queue
        run: python src/application_queue.py

      - name: Install browser automation
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Inspect and apply through public employer forms
        env:
          WEB_AUTO_APPLY_ENABLED: "true"
          WEB_AUTO_APPLY_MIN_SCORE: "65"
          WEB_AUTO_APPLY_MAX_PER_RUN: "30"
        run: python src/web_apply.py

      - name: Yahoo email applications
        env:
          AUTO_EMAIL_ENABLED: "true"
          YAHOO_EMAIL: ${{ secrets.YAHOO_EMAIL }}
          YAHOO_APP_PASSWORD: ${{ secrets.YAHOO_APP_PASSWORD }}
          AUTO_EMAIL_MIN_SCORE: "65"
        run: python src/email_sender.py

      - name: WhatsApp Cloud API delivery (disabled in free mode)
        env:
          WHATSAPP_ENABLED: "false"
        run: python src/whatsapp_sender.py

      - name: Build report
        run: python src/report_generator.py

      - name: Upload job report and application data
        uses: actions/upload-artifact@v4
        with:
          name: fahad-job-agent-report
          path: |
            JOB_REPORT.md
            data/jobs.json
            data/applications.json
            data/application_queue.json
            data/sent_applications.json
            cvs/graphic_designer_cv.pdf
            cvs/business_computer_cv.pdf

      - name: Commit latest results
        run: |
          git config user.name "Fahad Job Agent"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json data/applications.json data/application_queue.json data/sent_applications.json JOB_REPORT.md
          git diff --cached --quiet || git commit -m "Update job matches and application queue"
          git fetch origin main
          # The workflow's generated job data/report are the outputs of this run.
          # If another commit updated those same generated files during the run,
          # prefer this run's generated versions while replaying onto the latest main.
          git rebase -X theirs origin/main
          git push
