name: Fahad Job Agent

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - ".github/workflows/job-agent.yml"
      - "cvs/**"
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 13 * * *"

concurrency:
  group: fahad-job-agent-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  search-and-prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate final CVs
        run: |
          test -s cvs/graphic_designer_cv.pdf
          test -s cvs/business_computer_cv.pdf
          echo "Final CVs found:"
          ls -lh cvs/graphic_designer_cv.pdf cvs/business_computer_cv.pdf

      - name: Validate Python syntax
        run: python -m py_compile src/*.py

      - name: Sync Forbes Global 2000 targets
        run: python src/forbes_global2000.py

      - name: Search jobs
        run: python src/job_search.py

      - name: Prepare applications
        run: python src/application_generator.py

      - name: Build compliant application queue
        run: python src/application_queue.py

      - name: Install browser automation
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Inspect and apply through public employer forms
        env:
          WEB_AUTO_APPLY_ENABLED: "true"
          WEB_AUTO_APPLY_MIN_SCORE: "65"
          WEB_AUTO_APPLY_MAX_PER_RUN: "30"
        run: python src/web_apply.py

      - name: Yahoo email applications
        env:
          AUTO_EMAIL_ENABLED: "true"
          YAHOO_EMAIL: ${{ secrets.YAHOO_EMAIL }}
          YAHOO_APP_PASSWORD: ${{ secrets.YAHOO_APP_PASSWORD }}
          AUTO_EMAIL_MIN_SCORE: "65"
        run: python src/email_sender.py

      - name: WhatsApp Cloud API delivery
        env:
          WHATSAPP_ENABLED: "true"
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_WABA_ID: ${{ secrets.WHATSAPP_WABA_ID }}
          WHATSAPP_API_VERSION: "v24.0"
          WHATSAPP_APPLICATION_TEMPLATE_NAME: "job_application_cv"
          WHATSAPP_TEMPLATE_LANGUAGE: "en"
          WHATSAPP_TEMPLATE_DOCUMENT_HEADER: "true"
          WHATSAPP_MIN_SCORE: "65"
          WHATSAPP_REQUIRE_OPT_IN: "true"
        run: python src/whatsapp_sender.py

      - name: Build report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          jobs = json.loads(Path("data/jobs.json").read_text())["jobs"]
          queue = json.loads(Path("data/application_queue.json").read_text())["queue"]

          lines = [
              "# Fahad Job Agent Report",
              "",
              "Generated matches: **%d**" % len(jobs),
              "",
              "## CVs in use",
              "",
              "- Graphic Designer: `cvs/graphic_designer_cv.pdf`",
              "- Business Support: `cvs/business_computer_cv.pdf`",
              "",
              "## Application modes",
              "",
              "| Mode | Meaning |",
              "|---|---|",
              "| EMAIL_READY | Employer email found; ready for permitted email automation |",
              "| WHATSAPP_READY | WhatsApp number found; click-to-chat message prepared |",
              "| PHONE_ACTION | Phone number found; call details prepared |",
              "| WEB_APPLICATION | Public forms are inspected and submitted when all required answers are known; protected steps remain manual |",
              "| REVIEW | Needs review |",
              "",
              "## Top matches",
              "",
              "| Score | CV | Mode | Web status | Job | Source | Link |",
              "|---:|---|---|---|---|---|"
          ]

          for j in queue[:100]:
              title = (j.get("title") or "").replace("|", "/")
              src = (j.get("source") or "").replace("|", "/")
              lines.append(
                  f'| {j.get("score","")} | {j.get("cv","")} | {j.get("mode","")} | {j.get("web_apply_status","not_checked")} | '
                  f'{title} | {src} | [Open]({j.get("application_url") or j.get("url","")}) |'
              )

          Path("JOB_REPORT.md").write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: Upload job report and application data
        uses: actions/upload-artifact@v4
        with:
          name: fahad-job-agent-report
          path: |
            JOB_REPORT.md
            data/jobs.json
            data/applications.json
            data/application_queue.json
            data/sent_applications.json
            cvs/graphic_designer_cv.pdf
            cvs/business_computer_cv.pdf

      - name: Commit latest results
        run: |
          git config user.name "Fahad Job Agent"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json data/applications.json data/application_queue.json data/sent_applications.json JOB_REPORT.md
          git diff --cached --quiet || git commit -m "Update job matches and application queue"
          git pull --rebase origin main
          git push
