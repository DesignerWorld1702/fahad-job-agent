name: Fahad Job Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 13 * * *"

permissions:
  contents: write

jobs:
  search-and-prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Search jobs
        run: python src/job_search.py
      - name: Prepare applications
        run: python src/application_generator.py
      - name: Build report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          jobs=json.loads(Path("data/jobs.json").read_text())["jobs"]
          lines=["# Fahad Job Agent Report","","Generated job matches: **%d**"%len(jobs),"","| Score | CV | Job | Source | Link |","|---:|---|---|---|---|"]
          for j in jobs[:100]:
              title=j["title"].replace("|","/")
              src=j.get("source","").replace("|","/")
              lines.append(f'| {j["match_score"]} | {j["cv"]} | {title} | {src} | [Open]({j["url"]}) |')
          Path("JOB_REPORT.md").write_text("\n".join(lines),encoding="utf-8")
          PY
      - name: Commit latest results
        run: |
          git config user.name "Fahad Job Agent"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json data/applications.json JOB_REPORT.md
          git diff --cached --quiet || git commit -m "Update job matches and application queue"
          git push
