name: WhatsApp Safe Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  whatsapp-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create deterministic delivery test queue
        env:
          TEST_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run_id = os.environ["TEST_RUN_ID"]
          queue = [{
              "title": "TEST – Graphic Designer",
              "url": f"https://example.com/fahad-job-agent-test/{run_id}",
              "score": 65,
              "cv": "graphic_designer_cv",
              "cv_url": "https://github.com/DesignerWorld1702/fahad-job-agent/raw/refs/heads/main/cvs/graphic_designer_cv.pdf",
              "portfolio_url": "https://www.behance.net/zubairkhan1",
              "email_subject": "[TEST] Application – Graphic Designer – Fahad Asif",
              "email_body": (
                  "Dear Hiring Manager,\\n\\n"
                  "I’m interested in the Graphic Designer opportunity and would love to bring my "
                  "4+ years of experience in branding, social media design, packaging, and marketing "
                  "creatives to your team.\\n\\n"
                  "I’ve attached my CV for your consideration. You can view my work here:\\n"
                  "Portfolio: https://www.behance.net/zubairkhan1\\n\\n"
                  "I’d be happy to discuss how I can contribute to your team.\\n\\n"
                  "Best regards,\\nFahad Asif\\n+92 340 7301498\\nFahadasif77@yahoo.com"
              ),
              "emails": [],
              "phones": [],
              "whatsapp_ready": False,
              "mode": "REVIEW"
          }]

          Path("data/application_queue.json").write_text(
              json.dumps({"queue": queue}, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )
          Path("data/sent_applications.json").write_text(
              json.dumps({"sent": []}, indent=2),
              encoding="utf-8"
          )
          print(f"Created one deterministic test application for run {run_id}.")

      - name: Send ONE Yahoo email test to Fahad's test inbox
        env:
          AUTO_EMAIL_ENABLED: "true"
          EMAIL_TEST_MODE: "true"
          EMAIL_TEST_RECIPIENT: "zk9783647@gmail.com"
          YAHOO_EMAIL: ${{ secrets.YAHOO_EMAIL }}
          YAHOO_APP_PASSWORD: ${{ secrets.YAHOO_APP_PASSWORD }}
          AUTO_EMAIL_MIN_SCORE: "55"
        run: python src/email_sender.py

      - name: Send ONE WhatsApp test to Fahad's own WhatsApp
        env:
          WHATSAPP_ENABLED: "true"
          WHATSAPP_TEST_MODE: "true"
          WHATSAPP_TEST_RECIPIENT: "923407301498"
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_WABA_ID: ${{ secrets.WHATSAPP_WABA_ID }}
          WHATSAPP_API_VERSION: "v24.0"
          WHATSAPP_APPLICATION_TEMPLATE_NAME: "job_application_cv"
          WHATSAPP_TEMPLATE_LANGUAGE: "en"
          WHATSAPP_TEMPLATE_DOCUMENT_HEADER: "true"
          WHATSAPP_MIN_SCORE: "55"
        run: python src/whatsapp_sender.py

      - name: Upload test result
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-safe-test-result
          path: |
            data/application_queue.json
            data/sent_applications.json
